name: Deploy Flutter Web to GitHub Pages with Mega E2E Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Web App
        # Building without base-href temporarily for local testing, or keeping it and running serve with routing
        run: flutter build web --base-href "/dental_app/"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E Dependencies
        working-directory: web_e2e
        run: npm ci || npm install

      - name: Run Web E2E Tests with Local Server
        working-directory: web_e2e
        env:
          TEST_BASE_URL: http://127.0.0.1:5173/dental_app/
        run: |
          mkdir -p ../build_serve/dental_app
          cp -r ../build/web/* ../build_serve/dental_app/
          npx -y serve ../build_serve -l 5173 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5173/dental_app/ > /dev/null; do sleep 1; done'
          echo "Server is up!"
          npx mocha tests/mega_web_1100.test.js --reporter ./utils/excelReporter.js

      - name: Inject HTML Reports into build/web
        if: always() # Run even if tests fail so reports are deployed
        run: |
          mkdir -p build/web/reports/latest
          mkdir -p build/web/reports/history/build-${{ github.run_number }}
          cp web_e2e/Test_Results/HTML/execution-report.html build/web/reports/latest/
          cp web_e2e/Test_Results/HTML/execution-report.html build/web/reports/history/build-${{ github.run_number }}/
          
          # Add summary
          echo "### 🚀 Mega E2E Suite Completed" >> $GITHUB_STEP_SUMMARY
          echo "[View Latest Execution Report](./reports/latest/execution-report.html)" >> $GITHUB_STEP_SUMMARY

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()
