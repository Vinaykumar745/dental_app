name: Deploy Flutter Web to GitHub Pages with Mega E2E Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Web App
        # Building without base-href temporarily for local testing, or keeping it and running serve with routing
        run: flutter build web --base-href "/dental_app/"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E Dependencies
        working-directory: web_e2e
        run: npm ci || npm install

      - name: Build and Prep Server
        run: |
          mkdir -p build_serve/dental_app
          cp -r build/web/* build_serve/dental_app/

      - name: Web E2E Tests
        working-directory: web_e2e
        env:
          TEST_BASE_URL: http://127.0.0.1:5173/dental_app/
          REPORT_NAME: Web-E2E-Report.xlsx
          TEST_SUITE_NAME: Mega Web 1100 Suite
        run: |
          npx serve ../build_serve -l 5173 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5173/dental_app/ > /dev/null; do sleep 1; done'
          npx mocha tests/mega_web_1100.test.js --reporter ./utils/excelReporter.js

      - name: Mobile E2E Tests
        working-directory: web_e2e
        env:
          TEST_BASE_URL: http://127.0.0.1:5173/dental_app/
          REPORT_NAME: Mobile-E2E-Report.xlsx
          TEST_SUITE_NAME: Mobile App E2E Suite
        run: |
          npx serve ../build_serve -l 5173 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:5173/dental_app/ > /dev/null; do sleep 1; done'
          npx mocha tests/mobile_e2e_400.test.js --reporter ./utils/excelReporter.js

      - name: API Load Testing
        working-directory: web_e2e
        env:
          TEST_BASE_URL: http://127.0.0.1:5173/dental_app/
          REPORT_NAME: API-Load-Test-Reports.xlsx
          TEST_SUITE_NAME: Performance Testing
        run: |
          npx mocha tests/api_load_400.test.js --reporter ./utils/excelReporter.js

      - name: API Functional Tests
        working-directory: web_e2e
        env:
          TEST_BASE_URL: http://127.0.0.1:5173/dental_app/
          REPORT_NAME: API-E2E-Report.xlsx
          TEST_SUITE_NAME: Backend API E2E Suite
        run: |
          npx mocha tests/api_functional_400.test.js --reporter ./utils/excelReporter.js

      - name: Upload API E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: API-E2E-Report
          path: web_e2e/Test_Results/API-E2E-Report.xlsx

      - name: Upload API Load Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: API-Load-Test-Reports
          path: web_e2e/Test_Results/API-Load-Test-Reports.xlsx

      - name: Upload Mobile E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mobile-E2E-Report
          path: web_e2e/Test_Results/Mobile-E2E-Report.xlsx

      - name: Upload Web E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Web-E2E-Report
          path: web_e2e/Test_Results/Web-E2E-Report.xlsx

      - name: Inject HTML Reports into build/web
        if: always() # Run even if tests fail so reports are deployed
        run: |
          mkdir -p build/web/reports/latest
          mkdir -p build/web/reports/history/build-${{ github.run_number }}
          cp web_e2e/Test_Results/HTML/execution-report.html build/web/reports/latest/ || true
          cp web_e2e/Test_Results/HTML/execution-report.html build/web/reports/history/build-${{ github.run_number }}/ || true
          
          # Add summary
          echo "### 🚀 Mega E2E Suite Completed" >> $GITHUB_STEP_SUMMARY
          echo "[View Latest Execution Report](./reports/latest/execution-report.html)" >> $GITHUB_STEP_SUMMARY
