services:
  - type: web
    name: dentalscan-backend
    plan: free
    env: python
    buildCommand: "git submodule update --init && cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
